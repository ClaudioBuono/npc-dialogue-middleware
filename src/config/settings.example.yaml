# Middleware settings. Copy this file to settings.yaml to customize it.
# Missing fields fall back to the defaults defined in AppSettings.

# Language.
# Language used for the generated dialogue. See the Language enum for valid values.
# Type: string | Default: "en"
language: "en"

# Number of options.
# Number of player response options generated per turn.
# Type: integer | Default: 2
number_of_options: 3

# Profiling.
# When enabled, performance profiling is turned on.
# Type: boolean | Default: false
profiling: false

# Fairness filter.
# When enabled, a fairness instruction is added to the system prompt to avoid
# biased or unfair content, and fairness questions are included in the judger evaluation.
# Type: boolean | Default: true
fairness_filter: true

# Profanity filter.
# When enabled, banned words in the generated dialogue are replaced using
# censor_word. Applies to both StreamMode and GenerateMode.
# Type: boolean | Default: true
profanity_filter: true

# Censor word.
# Replacement text used for banned words when profanity_filter is enabled.
# Type: string | Default: "[CENSORED]"
censor_word: "[CENSORED]"

# Refine dialogue.
# When enabled in GenerateMode, the dialogue is iteratively refined by the
# refiner using the judger questions enabled by fairness_filter and
# profanity_filter, up to refiner_max_iterations passes.
# Not applicable to StreamMode.
# Type: boolean | Default: true
refine_dialogue: true

# Refiner max iterations.
# Maximum number of refinement iterations.
# Type: integer | Default: 3
refiner_max_iterations: 3

llm:
  # Sampling temperature for each LLM role (range: 0.0 to 2.0).
  # Lower = more deterministic and consistent, higher = more varied and creative.

  # Generates the dialogue.
  # Higher values give more varied, creative lines; lower values give safer, more predictable ones.
  # Default: 0.7
  dialogue_generator_temperature: 0.3

  # Evaluates the generated dialogue.
  # Keep it low so scoring stays consistent and repeatable across runs.
  # Default: 0.2
  judger_temperature: 0.3

  # Fixes and refines dialogue that failed evaluation.
  # A moderate value lets it rewrite lines without drifting too far from the original.
  # Default: 0.4
  healer_temperature: 0.5